function toggleAuto(){ save.autoOn = !save.autoOn; persist(); buzz(20); }

function restore(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s){
      save = Object.assign(save, s);
      save.boosts = Object.assign({shield:0, x2:0, slow:0}, s.boosts || {});
      save.codeOn = Object.assign({NOOB:false, SLOW:false, EASY:false, TURBO:false}, s.codeOn || {});

}
function idxOf(id){ return Math.max(0, BIRDS.findIndex(b => b.id === id)); }
function hasPower(p){ return (POWERS[save.bird] || []).includes(p); }
function unlockBird(id){
  const name = BIRDS[idxOf(id)].name;
  if (save.owned.includes(id)) return 'ALREADY OWNED';
  save.owned.push(id);
  return 'UNLOCKED ' + name;
}

const cv = document.getElementById('c');

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // use the real visible viewport (browser bars change it on phones)
  const vv = window.visualViewport;
  const vw = vv ? vv.width  : innerWidth;
  const vh = vv ? vv.height : innerHeight;
  cv.style.width  = vw + 'px';
  cv.style.height = vh + 'px';
  cv.width  = Math.floor(vw * DPR);
  cv.height = Math.floor(vh * DPR);
  // fit width; if the screen is too short, fit height instead
  scale = cv.width / W;
  if (cv.height / scale < 640) scale = cv.height / 640;
  ox = (cv.width - W * scale) / 2;
  oy = 0;
  H = cv.height / scale;
  GROUND = H - 98;
}
addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

// ================= PRERENDERED LAYERS =================
let SKY, CITY, GROUND_T;
function mk(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function buildLayers(){
  // sky + static clouds
  SKY = mk(W, H);
  let g = SKY.getContext('2d');
  const sg = g.createLinearGradient(0, 0, 0, H);
  sg.addColorStop(0, '#2f8fff'); sg.addColorStop(0.65, '#8fd2ff'); sg.addColorStop(1, '#d6f0ff');
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,0.9)';
  for (const [x, y, r] of [[44,118,28],[122,92,22],[258,150,32],[326,108,20],[160,240,18]]){
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.arc(x + r * 1.1, y - r * 0.35, r * 1.1, 0, Math.PI * 2);
    g.arc(x + r * 2.1, y, r * 0.9, 0, Math.PI * 2);
    g.fill();
  }
  // city tile (360 wide, seamless)
  CITY = mk(W, 100);
  g = CITY.getContext('2d');
  const blocks = [[0,40,58,'#c4ead8'],[40,54,78,'#abdcc6'],[94,36,50,'#c4ead8'],[130,62,88,'#abdcc6'],
                  [192,44,60,'#c4ead8'],[236,58,74,'#abdcc6'],[294,66,46,'#c4ead8']];
  for (const [x, w, h, col] of blocks){
    g.fillStyle = col; g.fillRect(x, 100 - h, w, h);
    g.fillStyle = '#8fcdb2';
    for (let wy = 100 - h + 8; wy < 92; wy += 14)
      for (let wx = x + 7; wx < x + w - 9; wx += 12) g.fillRect(wx, wy, 5, 7);
  }
  // ground tile (360 wide, seamless)
  GROUND_T = mk(W, 104);
  g = GROUND_T.getContext('2d');
  g.fillStyle = '#d9a25b'; g.fillRect(0, 0, W, 104);
  g.strokeStyle = 'rgba(122,70,30,0.35)'; g.lineWidth = 2;
  for (let k = 0; k < 4; k++){
    g.beginPath();
    for (let x = 0; x <= W; x += 6){
      const y = 30 + k * 18 + Math.sin(x / W * Math.PI * 4 + k) * 3;
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  }
  g.fillStyle = '#fbe3a2'; g.fillRect(0, 90, W, 14);
  g.fillStyle = '#63c44e'; g.fillRect(0, 0, W, 14);
  for (let x = 0; x < W; x += 24){ g.beginPath(); g.arc(x + 12, 12, 12, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#3f8f32'; g.fillRect(0, 12, W, 3);
}

let AC = null, gMusic = null, gSfx = null, nextNote = 0, noteIdx = 0;
const LEAD = [523.25,659.25,783.99,659.25,587.33,698.46,880.00,698.46,
              523.25,659.25,783.99,987.77,880.00,783.99,659.25,587.33];

function audioInit(){
  if (AC){ if (AC.state === 'suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    gMusic = AC.createGain();
    const warm = AC.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 1400;
    gMusic.connect(warm); warm.connect(AC.destination);
    gSfx = AC.createGain(); gSfx.connect(AC.destination);
    setVolumes();
    nextNote = AC.currentTime + 0.15;
  }catch(e){ AC = null; }
}
function setVolumes(){
  if (!AC) return;
  gMusic.gain.setTargetAtTime(save.music / 100 * 0.16, AC.currentTime, 0.05);
  gSfx.gain.setTargetAtTime(save.sfx / 100 * 0.5, AC.currentTime, 0.05);
}
function tone(dest, freq, t, dur, type, peak, slideTo){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.05);
}
const CHORDS = [[261.63,329.63,392.00],[220.00,261.63,329.63],[174.61,220.00,261.63],[196.00,246.94,293.66]];
let chordIdx = 0, stepIdx = 0;
function musicTick(){
  if (!AC || AC.state !== 'running') return;
  const STEP = 0.5;                       // slow tempo
  while (nextNote < AC.currentTime + 0.5){
    const ch = CHORDS[chordIdx];
    if (stepIdx === 0){
      for (const f of ch) tone(gMusic, f, nextNote, 2.6, 'sine', 0.09);   // soft pad
    }
    const f = ch[[0, 1, 2, 1][stepIdx]] * 2;                               // arpeggio
    tone(gMusic, f, nextNote, 1.1, 'sine', 0.12);
    nextNote += STEP; stepIdx++;
    if (stepIdx === 4){ stepIdx = 0; chordIdx = (chordIdx + 1) % CHORDS.length; }
  }
}
function sfxOK(){ return AC && AC.state === 'running'; }
function sfxChime(){
  if (!sfxOK()) return;
  const t = AC.currentTime;
  tone(gSfx, 880, t, 0.25, 'sine', 0.6);
  tone(gSfx, 1320, t + 0.12, 0.35, 'sine', 0.6);
}
function sfxCoin(){
  if (!sfxOK()) return;
  tone(gSfx, 1200, AC.currentTime, 0.12, 'square', 0.25, 1800);
}
function sfxCrash(){
  if (!sfxOK()) return;
  tone(gSfx, 220, AC.currentTime, 0.4, 'sawtooth', 0.4, 60);
}
function volLabel(v){ return v === 0 ? 'OFF' : v + '%'; }
function cycleVol(key){
  save[key] = (save[key] + 25) % 125;
  persist(); setVolumes();
  if (key === 'sfx') sfxCoin();
}

// ================= UI HELPERS =================
let hits = [], pressId = null, pressFn = null;
function hit(id, x, y, w, h, fn){ hits.push({ id, x, y, w, h, fn }); }
function findHit(p){
  for (let i = hits.length - 1; i >= 0; i--){
    const h = hits[i];
    if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h;
  }
  return null;
}
function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function panel(x, y, w, h, fill = C.panel){
  ctx.save();
  ctx.shadowColor = 'rgba(20,60,70,0.25)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  rrect(x, y, w, h, 18); ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
  rrect(x + 1, y + 1, w - 2, h - 2, 17);
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
}
function text(str, x, y, size = 16, color = C.white, align = 'center'){
  ctx.save();
  ctx.font = `700 ${size}px Roboto, "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(20,50,60,0.4)'; ctx.shadowOffsetY = 2;
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function shade(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) * 0.72 | 0, g = ((n >> 8) & 255) * 0.72 | 0, b = (n & 255) * 0.72 | 0;
  return `rgb(${r},${g},${b})`;
}
function btn(id, x, y, w, h, label, o = {}, fn){
  const cx = x + w / 2, cy = y + h / 2;
  const k = pressId === id ? 0.96 : 1;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
  rrect(x, y + 3, w, h, 14); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  rrect(x, y, w, h, 14); ctx.fillStyle = C.panel2; ctx.fill();
  rrect(x + 1, y + 1, w - 2, h - 2, 13);
  ctx.lineWidth = 2; ctx.strokeStyle = pressId === id ? C.accent : C.green; ctx.stroke();
  ctx.restore();
  text(label, cx, o.sub ? cy - 7 : cy, o.size || 15, C.white);
  if (o.sub) text(o.sub, cx, cy + 11, 10, C.accent);
  if (fn) hit(id, x, y, w, h, fn);
}
let toastMsg = '', toastT = 0;
function toast(t){ toastMsg = t; toastT = performance.now(); }
function drawToast(y){
  if (!toastMsg || performance.now() - toastT > 2200) return;
  const w = Math.min(320, 14 + toastMsg.length * 9.5);
  panel(W / 2 - w / 2, y - 16, w, 32, C.ink);
  text(toastMsg, W / 2, y, 13, C.white);
}

// ================= BIRD ART =================
// Sprite is 300x221 px. Drawn at scale BK so its centre (170,110) sits at the origin.
const BIRD_W = 52;              // on-screen width of the bird (logical px)
const BK = BIRD_W / 300;
function drawAccessory(id){
  // HEAD = top of the bird's head, BODY = middle of the body (logical units)
  ctx.save();
  ctx.filter = 'none';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  if (id === 'shield'){
    ctx.fillStyle = '#2f7fa8';
    ctx.beginPath(); ctx.moveTo(-6,-1); ctx.lineTo(-1,-5); ctx.lineTo(4,-1); ctx.lineTo(2,6); ctx.lineTo(-1,8); ctx.lineTo(-4,6); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (id === 'magnet'){
    ctx.lineWidth = 5; ctx.strokeStyle = '#d0453a';
    ctx.beginPath(); ctx.arc(4,-17,8,Math.PI,0); ctx.stroke();
    ctx.fillStyle = '#cfd6dd'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
    ctx.fillRect(-4,-18,4,5); ctx.strokeRect(-4,-18,4,5);
    ctx.fillRect(8,-18,4,5); ctx.strokeRect(8,-18,4,5);
  } else if (id === 'feather'){
    ctx.fillStyle = '#b983ff';
    for (const k of [-1,0,1]){
      ctx.save(); ctx.translate(2 + k*4, -18); ctx.rotate(k*0.35);
      ctx.beginPath(); ctx.ellipse(0,-6,2.5,8,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  } else if (id === 'lucky'){
    ctx.fillStyle = '#ff6fb0';
    ctx.beginPath(); ctx.moveTo(12,15); ctx.lineTo(6,11); ctx.lineTo(6,19); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12,15); ctx.lineTo(18,11); ctx.lineTo(18,19); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(12,15,2.2,0,Math.PI*2); ctx.fillStyle = '#ffd1e6'; ctx.fill(); ctx.stroke();
  } else if (id === 'ultra'){
    ctx.fillStyle = '#ffd34a';
    ctx.beginPath();
    ctx.moveTo(-4,-19); ctx.lineTo(-4,-27); ctx.lineTo(0,-23); ctx.lineTo(4,-30);
    ctx.lineTo(8,-23); ctx.lineTo(12,-27); ctx.lineTo(12,-19); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e04b8a'; ctx.beginPath(); ctx.arc(4,-24,1.6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawBirdSprite(x, y, o = {}){
  const idx = o.idx ?? idxOf(save.bird);
  const b = BIRDS[idx];
  ctx.save();
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.translate(x, y);
  ctx.rotate(o.rot || 0);
  const s = o.s || 1, sy = o.sy || 1;
  ctx.scale(s * (1 + (1 - sy) * 0.5), s * sy);
  if (b.id === 'ultra'){
    ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,215,90,0.3)'; ctx.fill();
  }
  if (b.hue) ctx.filter = `hue-rotate(${b.hue}deg)`;
  ctx.drawImage(SPR.bird, -170 * BK, -110 * BK, 300 * BK, 221 * BK);
  ctx.filter = 'none';
  ctx.scale(BIRD_W / 70, BIRD_W / 70);   // accessories were designed for a 70px bird
  drawAccessory(b.id);
  ctx.restore();
}

let bgOff = 0, groundOff = 0;
function drawBackground(){
  ctx.fillStyle = '#d6f0ff'; ctx.fillRect(-W * 2, 0, W * 5, H);
  for (let k = -2; k <= 2; k++) ctx.drawImage(SKY, k * W, 0);
  const off = ((bgOff % W) + W) % W;
  for (let k = -2; k <= 2; k++) ctx.drawImage(CITY, k * W + off, GROUND - 92);
}
function drawGround(){
  const off = ((groundOff % W) + W) % W;
  for (let k = -2; k <= 2; k++) ctx.drawImage(GROUND_T, k * W - off, H - 104);
  ctx.fillStyle = '#fbe3a2'; ctx.fillRect(-W * 2, H - 14, W * 5, 14);
}
function pipeGrad(x, w){
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#7fcb45'); g.addColorStop(0.3, '#c6f08a'); g.addColorStop(0.55, '#7cc64c'); g.addColorStop(1, '#3f7f2c');
  return g;
}
function drawPipeRect(x, y, w, h, radius){
  ctx.fillStyle = pipeGrad(x, w);
  rrect(x, y, w, h, radius); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
}
function drawPipes(){
  for (const p of pipes){
    const top = p.c - p.gap / 2, bot = p.c + p.gap / 2;
    drawPipeRect(p.x + 5, -2, PIPE_W - 10, top - CAP_H + 2, 4);
    drawPipeRect(p.x - 5, top - CAP_H, CAP_W, CAP_H, 6);
    drawPipeRect(p.x - 5, bot, CAP_W, CAP_H, 6);
    drawPipeRect(p.x + 5, bot + CAP_H, PIPE_W - 10, H - bot - CAP_H + 2, 4);
  }
}
function drawCoin(x, y, r = 12){
  ctx.save();
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
  g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ffc93c'); g.addColorStop(1, '#d98a12');
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(160,90,10,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function redeem(raw){
  const code = (raw || '').trim().toUpperCase();
  if (!code) return 'ENTER A CODE';
  const def = CODE_DEFS.find(d => d.code === code);
  if (!def) return 'WRONG CODE';
  if (def.type === 'toggle'){
    save.codeOn[code] = !save.codeOn[code];
    if (!save.redeemed.includes(code)) save.redeemed.push(code);
    persist();
    return code + ' ' + (save.codeOn[code] ? 'ON' : 'OFF');
  }
  if (save.redeemed.includes(code)) return 'ALREADY USED';
  save.redeemed.push(code);
  let r = '';
  if (code === 'COINS') { save.coins += 500; r = '+500 COINS'; }
  if (code === 'GOLD') { save.coins += 2000; r = '+2000 COINS'; }
  if (code === 'SHIELD3') { save.boosts.shield += 3; r = '+3 SHIELDS'; }
  if (code === 'LUCKY') r = unlockBird('lucky');
  if (code === 'FLY') r = unlockBird('feather');
  if (code === 'MAGNET') r = unlockBird('magnet');
  if (code === 'RICH') { save.coins += 10000; r = '+10000 COINS'; }
  persist();
  return r;
}

// ================= GAME =================
let screen = 'menu', phase = 'ready', mode = 'classic', paused = false;
let baseSpeed = 2.6, slowLeft = 0, x2Run = false;
let bird, pipes = [], coins = [], particles = [], popups = [];
let score = 0, speed = 2.6, runCoins = 0, coinMul = 1, shields = 0, gap = 150, grav = 0.42, flapV = -7.4;
let popT = 0, deadAt = 0, shake = 0, fadeA = 0;
let returnScreen = 'menu';   // where the BACK button of shop/codes goes
function goBack(){ const s = returnScreen; returnScreen = 'menu'; setScreen(s); }

function startRun(m){
  mode = m;
  const turbo = !!save.codeOn.TURBO, easy = !!save.codeOn.EASY;
  const x2 = save.boosts.x2 > 0; if (x2) save.boosts.x2--;
  const slow = save.boosts.slow > 0; if (slow) save.boosts.slow--;
  coinMul = (x2 ? 2 : 1) * (turbo ? 2 : 1);
  baseSpeed = turbo ? 3.4 : (save.codeOn.SLOW ? 2.0 : 2.6);
  slowLeft = slow ? 10 : 0;
  speed = slow ? 1.4 : baseSpeed;
  x2Run = x2;
  gap = (mode === 'power' ? 150 : 160) + (easy ? 30 : 0);
  const feather = hasPower('float');
  grav = feather ? 0.28 : 0.42;
  flapV = feather ? -6.4 : -7.4;
  shields = (hasPower('shield') ? 1 : 0) + save.boosts.shield;
  save.boosts.shield = 0;
  persist();
  bird = { x: 100, y: H * 0.42, vy: 0, rot: 0, sy: 1 };
  pipes = []; coins = []; particles = []; popups = [];
  score = 0; runCoins = 0; popT = 0; deadAt = 0; paused = false;
  phase = 'ready';
  if (save.auto && save.autoOn){ phase = 'run'; bird.vy = flapV; }
  setScreen('game');
}
function addPipe(){
  const c = 150 + Math.random() * (GROUND - 300);
  const p = { x: W + 10, c, gap, passed: false };
  pipes.push(p);
  if (mode === 'power' && Math.random() < 0.7){
    coins.push({ x: p.x + PIPE_W / 2, y: c, taken: false });
    if (Math.random() < 0.5) coins.push({ x: p.x + PIPE_W / 2 + 34, y: c - 50, taken: false });
  }
}
function burst(x, y, color, n, m = 1){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = (1 + Math.random() * 3) * m;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 28 + Math.random() * 14, max: 42, color, r: 2 + Math.random() * 2.5 });
  }
}
function autoPilot(){
  if (!save.auto || !save.autoOn) return;
  // aim for the gap of the next pipe the bird has not passed yet
  let target = H * 0.5;
  for (const p of pipes){
    if (p.x + PIPE_W > bird.x - 12){ target = p.c; break; }
  }
  if (bird.y > target + 8 && bird.vy > -2) flap();
  if (bird.y > GROUND - 70 && bird.vy > 0) flap();
}
function flap(){
  if (phase === 'ready') phase = 'run';
  if (phase === 'run'){ bird.vy = flapV; bird.sy = 0.72; }
}
function finishRun(){
  if (mode === 'power') save.coins += runCoins;
  if (score > save.best) save.best = score;
  persist();
}
function crash(bounce = -6, ground = false){
  if (save.codeOn.NOOB){
    if (ground){ bird.vy = -6.5; buzz(35); }
    return;
  }
  if (shields > 0){
    shields--; shake = 10; bird.vy = bounce; burst(bird.x, bird.y, '#9fe0ff', 12); buzz([60, 40, 60]);
    return;
  }
  phase = 'over'; deadAt = performance.now(); shake = 14; buzz([200, 80, 300, 80, 200]); sfxCrash();
  burst(bird.x, bird.y, '#ffe27a', 18, 1.3);
  finishRun();
}
function updateGame(f){
  frameN++;
  if (phase === 'ready'){
    bird.y = H * 0.42 + Math.sin(frameN * 0.08) * 8;
    groundOff -= 1.2 * f; bgOff -= 0.4 * f;
    return;
  }
  groundOff -= (phase === 'run' ? speed : 1) * f;
  bgOff -= (phase === 'run' ? speed * 0.3 : 0.3) * f;

  if (phase === 'run'){
    const last = pipes[pipes.length - 1];
    if (!last || last.x < W - SPACING) addPipe();
    for (const p of pipes){
      p.x -= speed * f;
      if (!p.passed && p.x + PIPE_W < bird.x){
        p.passed = true; score++; popT = 1;
        if (score % 10 === 0) sfxChime();
        if (slowLeft > 0){ slowLeft--; if (slowLeft === 0) speed = baseSpeed; }
        else if (speed < 4.8) speed += 0.03;
        if (mode === 'power' && hasPower('lucky')) runCoins += coinMul;
      }
    }
    pipes = pipes.filter(p => p.x > -CAP_W - 10);
    const magnet = hasPower('magnet');
    for (const c of coins){
      c.x -= speed * f;
      if (magnet && !c.taken){
        const d = Math.hypot(c.x - bird.x, c.y - bird.y);
        if (d < 120){ c.x += (bird.x - c.x) * 0.14 * f; c.y += (bird.y - c.y) * 0.14 * f; }
      }
      if (!c.taken && Math.hypot(c.x - bird.x, c.y - bird.y) < 26){
        c.taken = true; runCoins += coinMul; buzz(30); sfxCoin();
        popups.push({ x: c.x, y: c.y, t: '+' + coinMul, life: 40 });
        burst(c.x, c.y, C.gold, 6, 0.8);
      }
    }
    coins = coins.filter(c => c.x > -30 && !c.taken);
  }

  if (phase === 'run') autoPilot();
  if (phase === 'run' || phase === 'over'){
    bird.vy += grav * f;
    bird.y += bird.vy * f;
  }
  const targetRot = Math.max(-0.5, Math.min(1.2, bird.vy * 0.07));
  bird.rot += (targetRot - bird.rot) * 0.2 * f;
  bird.sy += (1 - bird.sy) * 0.18 * f;

  // hitbox: a box that covers the visible bird (beak, tail and wings included)
  const hx = 16, hy = 12;
  if (phase === 'run'){
    if (bird.y + hy > GROUND){ bird.y = GROUND - hy; crash(-6, true); }
    if (bird.y - hy < 0){ bird.y = hy; if (bird.vy < 0) bird.vy = 0; }
    if (phase === 'run'){
      for (const p of pipes){
        // the pipe caps stick out 5px on each side, so the box covers the cap width too
        if (bird.x + hx > p.x - 5 && bird.x - hx < p.x + CAP_W - 5){
          if (bird.y - hy < p.c - p.gap / 2 || bird.y + hy > p.c + p.gap / 2){ crash(-3); break; }
        }
      }
    }
  } else if (phase === 'over'){
    if (bird.y + hy > GROUND){ bird.y = GROUND - hy; bird.vy = 0; }
  }

  for (const p of particles){ p.x += p.vx * f; p.y += p.vy * f; p.vy += 0.2 * f; p.life -= f; }
  particles = particles.filter(p => p.life > 0);
  for (const q of popups){ q.y -= 0.7 * f; q.life -= f; }
  popups = popups.filter(q => q.life > 0);
  if (popT > 0) popT = Math.max(0, popT - 0.08 * f);
  if (shake > 0) shake = Math.max(0, shake - 0.8 * f);
}

function drawPauseButton(){
  btn('pause', W - 52, 14, 38, 38, '', { fill: 'rgba(19,29,51,0.95)', edge: '#c9b98e' }, () => { paused = true; });
  ctx.save();
  ctx.fillStyle = C.white;
  ctx.fillRect(W - 40, 24, 5, 18);
  ctx.fillRect(W - 31, 24, 5, 18);
  ctx.restore();
}
function drawHUD(){
  if (mode === 'power'){
    panel(12, 12, 112, 36, C.panel);
    drawCoin(32, 30, 10);
    text(String(runCoins), 112, 30, 17, C.accent, 'right');
  }
  if (shields > 0){
    panel(12, 54, 112, 28, '#16233d');
    text('SHIELD ' + shields, 68, 68, 12, C.blue);
  }
  let by = 88;
  if (slowLeft > 0){ panel(12, by, 112, 26, C.panel); text('SLOW START', 68, by + 13, 11, C.blue); by += 32; }
  if (x2Run && mode === 'power'){ panel(12, by, 112, 26, C.panel); text('COIN x2', 68, by + 13, 11, C.gold); }
  if (save.codeOn.NOOB){ panel(W / 2 - 46, 12, 92, 26, C.red); text('NOOB MODE', W / 2, 25, 11, C.white); }
  text(String(score), W / 2, 96, 50 + popT * 8, '#000000');
  drawPauseButton();
}
function drawGameScene(){
  drawPipes();
  for (const c of coins) drawCoin(c.x, c.y);
  drawGround();
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawBirdSprite(bird.x, bird.y, { rot: bird.rot, sy: bird.sy, s: 1 });
  if (shields > 0 && phase !== 'over'){
    ctx.save(); ctx.beginPath(); ctx.arc(bird.x, bird.y, 24, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,180,255,0.95)'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
  }
  for (const q of popups){
    ctx.globalAlpha = Math.min(1, q.life / 15);
    text(q.t, q.x, q.y - 14, 14, C.gold);
    ctx.globalAlpha = 1;
  }
  drawHUD();
  if (phase === 'ready'){
    panel(90, 430, 180, 44, 'rgba(19,29,51,0.95)');
    text('TAP TO FLY', 180, 452, 15, C.accent);
  }
  if (paused) drawPauseOverlay();
  if (phase === 'over') drawOverPanel();
}
function drawPauseOverlay(){
  ctx.fillStyle = 'rgba(20,50,60,0.35)'; ctx.fillRect(0, 0, W, H);
  panel(30, 110, 300, 390, C.panel);
  text('PAUSED', 180, 146, 24, C.accent);
  btn('resume', 70, 166, 220, 46, 'RESUME', { fill: C.green, size: 15 }, () => { paused = false; });
  btn('p-menu', 70, 224, 220, 46, 'MAIN MENU', { fill: C.slate, edge: C.slateD, size: 15 }, () => { finishRun(); setScreen('menu'); });
  btn('p-shop', 70, 282, 220, 46, 'SHOP', { fill: C.gold, edge: C.goldD, color: C.ink, size: 15 }, () => { returnScreen = 'game'; setScreen('shop'); });
  btn('p-codes', 70, 340, 220, 46, 'CODES', { fill: C.purple, edge: C.purpleD, size: 15 }, () => { returnScreen = 'game'; setScreen('codes'); });
  btn('p-music', 70, 398, 104, 40, 'MUSIC ' + volLabel(save.music), { fill: C.blue, edge: C.blueD, size: 12 }, () => cycleVol('music'));
  if (save.auto) btn('p-auto', 70, 446, 220, 40, 'AUTO PILOT ' + (save.autoOn ? 'ON' : 'OFF'), { size: 13 }, toggleAuto);
  btn('p-vibe', 186, 398, 104, 40, 'VIBE ' + (save.vibe ? 'ON' : 'OFF'), { fill: save.vibe ? C.green : C.grey, edge: save.vibe ? C.greenD : '#8ea0a5', size: 12 }, () => {
    save.vibe = !save.vibe; persist(); buzz(30);
  });
}
function drawOverPanel(){
  const since = performance.now() - deadAt;
  ctx.save(); ctx.globalAlpha = Math.min(1, since / 250);
  panel(30, 150, 300, 310, C.panel);
  text('GAME OVER', 180, 192, 24, C.accent);
  text('SCORE', 180, 230, 12, C.muted);
  text(String(score), 180, 268, 44, C.accent);
  text(mode === 'power' ? '+' + runCoins + ' COINS' : 'BEST ' + save.best, 180, 306, 14, C.accent);
  ctx.restore();
  if (since > 450){
    btn('again', 70, 330, 220, 48, 'PLAY AGAIN', { fill: C.green, size: 15 }, () => startRun(mode));
    btn('over-menu', 70, 392, 220, 48, 'MAIN MENU', { fill: C.slate, edge: C.slateD, size: 15 }, () => setScreen('menu'));
  }
}

// ================= SCREENS & FRAME =================
function setScreen(s, instant){
  screen = s;
  if (s !== 'codes') codeInput.style.display = 'none';
  if (s === 'game' && !instant){ /* fade on run start */ }
  if (!instant) fadeA = 1;
}
function render(){
  hits = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  // letterbox fill
  ctx.fillStyle = '#7fd6e3'; ctx.fillRect(-W * 2, -H * 2, W * 5, H * 5);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  if (screen === 'game'){
    drawGameScene();
  } else {
    drawGround();
    if (screen === 'menu') drawMenu();
    else if (screen === 'shop') drawShop();
    else if (screen === 'codes') drawCodes();
    else if (screen === 'settings') drawSettings();
  }
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  if (fadeA > 0){
    ctx.fillStyle = `rgba(11,18,34,${fadeA})`;
    ctx.fillRect(-W, -H, W * 3, H * 3);
  }
  if (screen === 'codes') placeCodeInput();
}
let lastT = 0;
function loop(t){
  const dt = Math.min(t - lastT || 16, 50);
  lastT = t;
  const f = dt / 16.67;
  if (fadeA > 0) fadeA = Math.max(0, fadeA - dt / 260);
  if (screen === 'game'){
    if (!paused) updateGame(f);
  } else {
    frameN++;
    groundOff -= 0.8 * f; bgOff -= 0.25 * f;
  }
  musicTick();
  render();
  requestAnimationFrame(loop);
}

// ================= INPUT =================
function toGame(e){
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) * (cv.width / r.width);
  const py = (e.clientY - r.top) * (cv.height / r.height);
  return { x: (px - ox) / scale, y: (py - oy) / scale };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  if (screen === 'game') buzz(12);
  const p = toGame(e);
  const h = findHit(p);
  if (h){ pressId = h.id; pressFn = h.fn; return; }
  if (screen === 'game' && !paused && phase !== 'over') flap();
});
cv.addEventListener('pointerup', e => {
  const h = findHit(toGame(e));
  const fn = pressFn && h && h.id === pressId ? pressFn : null;
  pressId = null; pressFn = null;
  if (fn){ buzz(20); fn(); }
});
cv.addEventListener('pointercancel', () => { pressId = null; pressFn = null; });
addEventListener('keydown', e => {
  audioInit();
  if (e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    if (screen === 'game' && !paused && phase !== 'over') flap();
    else if (screen === 'menu') startRun('classic');
  }
  if (e.code === 'Escape' && screen === 'game' && phase !== 'over') paused = !paused;
});
codeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    e.preventDefault();
    toast(redeem(codeInput.value)); codeInput.value = '';
  }
});

// ================= START =================
function start(){
  restore();
  buildLayers();
  previewIdx = idxOf(save.bird);
  bird = { x: 100, y: H * 0.42, vy: 0, rot: 0, sy: 1 };
  resize();
  requestAnimationFrame(loop);
}
resize();
</script>
